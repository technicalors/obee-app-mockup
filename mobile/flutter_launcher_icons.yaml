flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon/foreground.png
  # Keep the full circular mark inside Android's central 66/108 safe zone.
  adaptive_icon_foreground_inset: 20
  adaptive_icon_monochrome: assets/app_icon/monochrome.png
  min_sdk_android: 28
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
