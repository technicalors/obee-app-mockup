<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Obee Mobile Preview</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #20242c;
        background: #e9edf3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 18px;
        overflow: auto;
        background:
          radial-gradient(circle at 50% 5%, #ffffff 0, transparent 38%),
          #e9edf3;
      }

      .preview {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .phone {
        position: relative;
        width: min(454px, calc((100svh - 74px) * 454 / 956), calc(100vw - 36px));
        aspect-ratio: 454 / 956;
        padding: calc(12 / 454 * 100%);
        border: 1px solid #363940;
        border-radius: 50px;
        background: linear-gradient(145deg, #303238, #090a0c 18%, #050607 82%, #292b30);
        box-shadow:
          0 28px 70px rgb(28 36 48 / 28%),
          0 8px 20px rgb(28 36 48 / 18%),
          inset 0 0 0 1px rgb(255 255 255 / 10%);
      }

      .screen {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 38px;
        background: #ffffff;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 18%);
      }

      .screen iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }

      .button {
        position: absolute;
        width: 3px;
        border-radius: 3px 0 0 3px;
        background: #25272c;
      }

      .button--silent {
        top: 105px;
        left: -4px;
        height: 30px;
      }

      .button--volume-up {
        top: 157px;
        left: -4px;
        height: 54px;
      }

      .button--volume-down {
        top: 222px;
        left: -4px;
        height: 54px;
      }

      .button--power {
        top: 174px;
        right: -4px;
        width: 3px;
        height: 86px;
        border-radius: 0 3px 3px 0;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 20px;
        color: #596170;
        font-size: 12px;
      }

      .meta a {
        color: #3a4659;
        text-decoration: none;
      }

      .meta a:hover {
        text-decoration: underline;
      }

      @media (max-height: 760px), (max-width: 460px) {
        body {
          padding: 10px;
        }

        .phone {
          width: min(454px, calc((100svh - 54px) * 454 / 956), calc(100vw - 24px));
        }

        .meta {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <section class="phone" aria-label="Khung xem trước điện thoại 430 x 932">
        <span class="button button--silent" aria-hidden="true"></span>
        <span class="button button--volume-up" aria-hidden="true"></span>
        <span class="button button--volume-down" aria-hidden="true"></span>
        <span class="button button--power" aria-hidden="true"></span>
        <div class="screen">
          <iframe src="/mobile/app/" title="Ứng dụng Obee Mobile"></iframe>
        </div>
      </section>
      <div class="meta">
        <span>Màn hình 430 × 932 · 6.7 inch</span>
        <span aria-hidden="true">·</span>
        <a href="/mobile/app/" target="_blank" rel="noreferrer">Mở app trực tiếp</a>
      </div>
    </main>
  </body>
</html>
